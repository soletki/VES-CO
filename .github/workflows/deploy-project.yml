name: Build and Release VESCO

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore VESCO/VESCO.csproj

    - name: Build
      run: dotnet build VESCO/VESCO.csproj -c Release --no-restore

    - name: Publish
      run: dotnet publish VESCO/VESCO.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o publish

    - name: Zip release
      run: |
        Compress-Archive -Path publish\* -DestinationPath VESCO-${{ github.ref_name }}.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: VESCO-${{ github.ref_name }}.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
